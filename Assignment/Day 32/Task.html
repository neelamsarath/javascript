<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Destructuring, Spread & Rest Assignment</title>
</head>

<body>

    <h1>JavaScript Destructuring, Spread & Rest Assignment</h1>

    <script>


        // TASK 1: Array Destructuring

        let numbers1 = [10, 20, 30, 40, 50];
        let [first, second] = numbers1;
        console.log("Task 1 Result:");
        console.log("First Number:", first);
        console.log("Second Number:", second);


        // TASK 2: Array Destructuring with Rest Operator

        let colors = ["Red", "Blue", "Green", "Yellow", "Black"];
        let [color1, ...remainingColors] = colors;

        console.log("Task 2 Result:");
        console.log("First Color:", color1);
        console.log("Remaining Colors:", remainingColors);


        // TASK 3: Object Destructuring

        let person = {
            name: "Sarath",
            age: 22,
            city: "Chennai"
        };
        let { name, age, city } = person;

        console.log("Task 3 Result:");
        console.log("Name:", name);
        console.log("Age:", age);
        console.log("City:", city);


        // TASK 4: Object Destructuring with Renaming

        let student = {
            name: "Arun",
            age: 21,
            course: "Computer Science"
        };
        let { name: studentName, age: studentAge, course } = student;

        console.log("Task 4 Result:");
        console.log("Student Name:", studentName);
        console.log("Student Age:", studentAge);
        console.log("Course:", course);


        // TASK 5: Merge Two Arrays Using Spread Operator

        let array1 = [1, 2, 3];
        let array2 = [4, 5, 6];
        let mergedArray = [...array1, ...array2];
        console.log("Task 5 Result:");
        console.log("Merged Array:", mergedArray);


        // TASK 6: Add Elements at Beginning and End

        let fruits = ["Apple", "Banana", "Orange"];

        let newFruits = ["Mango", ...fruits, "Grapes"];

        console.log("Task 6 Result:");
        console.log("New Array:", newFruits);


        // TASK 7: Add Property to Object Using Spread Operator

        let personDetails = {
            name: "Rahul",
            age: 25
        };

        let newPerson = {
            ...personDetails,
            city: "Chennai"
        };

        console.log("Task 7 Result:");
        console.log("New Object:", newPerson);


        // TASK 8: Sum Any Number of Arguments Using Rest

        function calculateSum(...numbers) {
            let sum = 0;
            for (let number of numbers) {
                sum = sum + number;
            }
            return sum;
        }
        let result8 = calculateSum(10, 20, 30, 40, 50);

        console.log("Task 8 Result:");
        console.log("Sum:", result8);


        // TASK 9: Name as First Argument and Remaining
        // Arguments Using Rest Operator

        function userDetails(name, ...hobbies) {
            console.log("Name:", name);
            console.log("Remaining Arguments:", hobbies);
        }

        console.log("Task 9 Result:");

        userDetails(
            "Sarath",
            "Dancing",
            "Cricket",
            "Movies",
            "Music"
        );

        // TASK 10: Array Destructuring with Rest Operator

        let numbers10 = [10, 20, 30, 40, 50, 60];
        let [firstNumber, ...remainingNumbers] = numbers10;

        console.log("Task 10 Result:");
        console.log("First Element:", firstNumber);
        console.log("Remaining Elements:", remainingNumbers);


    </script>

</body>

</html>
