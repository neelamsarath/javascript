        console.log("---- factorial of a given no // 5!=5*4*3*2*1 =120 ----") 

        //without parameter
        n = Number(prompt("Enter a number"));
        function fact(){
        let f = 1;

        for (let i = n; i >= 1; i--) {
            f *= i;
        }
        console.log(f);
        }
        fact();

        //with parameter
        function fact1(a){
        let f = 1;

        for (let i = n; i >= a; i--) {
            f *= i;
        }
        console.log(f);
        }
        fact1(1);

        //with return
        function fact2(a){
        let f = 1;

        for (let i = n; i >= a; i--) {
            f *= i;
        }
        return f;
        }
        let result=fact2(1);
        console.log(result);

        console.log("---- find out the given no is prime or not ----");

        //without parameter
        let n = Number(prompt("Enter a number"));
        function prime(){
        let count = 0;

        for (let i = 1; i <= n; i++) {
            if (n % i == 0) {
                count++;
            }
        }

        if (count == 2) {
            console.log("It is a Prime Number");
        } else {
            console.log("It is not a Prime Number");
        }
        }
        prime();

        //with parameter
        function prime1(n){
        let count = 0;

        for (let i = 1; i <= n; i++) {

        }

        function prime2(n){
        let count = 0;

        for (let i = 1; i <= n; i++) {
            if (n % i == 0) {
                count++;
            }
        }
        return count==2;
        }
        result=prime2(n);
        if (result) {
            console.log("It is a Prime Number");
        } else {
            console.log("It is not a Prime Number");
        }

        console.log("---- Amstrong ----");

        
        let numb=Number(prompt("Enter the number to check if it is a amstrong or not"));
        //without parameter
        function ams(){
            let temp=numb;
            let r;
            let sum=0;

            while(temp>0){
                r=parseInt(temp)%10;
                sum+=r*r*r;
                temp=parseInt(temp/10);

        console.log("---- Amstrong number series ----");

        
        let limit=Number(prompt("Enter the limit"));
        //without parameter
        function amstseries(){
            let i = 1;
            let s = "";

            while (i <= limit) {

                let temp = i;
                let sum = 0;
                let r;

                while (temp > 0) {
                    r = temp % 10;
                    sum += r * r * r;
                    temp = parseInt(temp / 10);
                }

                if (i == sum) {
                    s += i + " ";
                }
                i++;
            }
            console.log(s);
        }

            }

        console.log("---- palindrome ----") 

        let word=prompt("Enter a word");

        //without parameter
        function palindrome(){
            let a="";
            for(let i=word.length-1;i>=0;i--){
                a+=word[i];
            }
            if(word==a){
                console.log("Its a palindrome")
            }else{
                console.log("Its not a palindrome")
            }
