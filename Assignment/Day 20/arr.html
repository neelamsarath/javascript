        console.log("---- find out the given no is prime or not ----");
        
        const prime=()=>{
        let n = Number(prompt("Enter a number to find out it is prime or not"));    
        let count = 0;

        for (let i = 1; i <= n; i++) {
            if (n % i == 0) {
                count++;
            }
        }

        if (count == 2) {
            console.log("It is a Prime Number");
        } else {
            console.log("It is not a Prime Number");
        }
        }

        console.log("---- Prime Number series ----");

        const primeseries=()=>{
        n = Number(prompt("Enter the limit to find prime number series"));
        s = "";

        for (let i = 2; i <= n; i++) {

            let count = 0;

            for (let j = 1; j <= i; j++) {
                if (i % j == 0) {
                    count++;
                }
            }

            if (count == 2) {
                s += i + " ";
            }
        }
        console.log(s);
        }

        console.log("---- Amstrong ----");

        const ams=()=>{
            let numb=Number(prompt("Enter the number to check if it is a amstrong or not"));
            let temp=numb;
            let r;
            let sum=0;

            while(temp>0){
                r=parseInt(temp)%10;
                sum+=r*r*r;
                temp=parseInt(temp/10);
            }
            if(numb==sum){
                console.log("Its an amstrong number")
            }else{
                console.log("It is not an amstrong number")
            }
        }
        ams();



        console.log("---- Amstrong number series ----");

        const amstseries=()=>{
            let limit=Number(prompt("Enter the limit for amstrong series"));
            let i = 1;
            let s = "";

            while (i <= limit) {

                let temp = i;
                let sum = 0;
                let r;

                while (temp > 0) {
                    r = temp % 10;
                    sum += r * r * r;
                    temp = parseInt(temp / 10);
                }

                if (i == sum) {
                    s += i + " ";
                }
                i++;
            }
            console.log(s);
        }
