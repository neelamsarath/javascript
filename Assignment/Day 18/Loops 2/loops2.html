        //for loop

        n = Number(prompt("Enter a number"));
        let f = 1;

        for (let i = n; i >= 1; i--) {
            f *= i;
        }

        //while loop
        f = 1;
        while (n >= 1) {
            f *= n;
            n--;
        }
        console.log(f);

        //Do while
        f = 1;
        do {
            f *= n;
            n--;
        } while (n >= 1);

        console.log("---- Amstrong number series ----");

        //while loop
        let limit=Number(prompt("Enter the limit"));
        
        
        let i = 1;
        let s = "";

        while (i <= limit) {

            let temp = i;
            let sum = 0;

                r = temp % 10;
                sum += r * r * r;
                temp = parseInt(temp / 10);
            }

            if (i == sum) {
                s += i + " ";
            }
            i++;
        }

        console.log("---- Prime Number series ----");

        //for loop
        n = Number(prompt("Enter the limit"));
        s = "";

        for (let i = 2; i <= n; i++) {

            let count = 0;

            for (let j = 1; j <= i; j++) {
                if (i % j == 0) {
                    count++;
                }
            }

            if (count == 2) {
                s += i + " ";
            }
        }
        console.log(s);

        //while
        s = "";
        i = 2;
        while (i <= n) {
            let count = 0;
            let j = 1;

            while (j <= i) {
                if (i % j == 0) {
                    count++;
                }
                j++;
            }

            if (count == 2) {
                s += i + " ";
            }
            i++;
        }
        console.log(s);

        //Do while
        s = "";
        i = 2;

        do {
            let count = 0;
            let j = 1;
            do {
                if (i % j == 0) {
                    count++;
                }
                j++;

            }while (j <= i);

            if (count == 2) {
                s += i + " ";
            }
            i++;
        } while (i <= n);
