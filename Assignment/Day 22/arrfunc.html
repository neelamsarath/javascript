        console.log("-- 4.Count positive and negative numbers --");

                if(pos[i]<0){

        console.log("-- 6.Search an Element --");

            let sar = [2,5,6,3,9];

            let found=false;

        console.log("-- 7.Find the frequency of each element");

            let bike = [1,2,1,2,3];
            let visited=[];

            for(let i=0;i<bike.length;i++){
                if(visited[i]){
                    continue;
                }
                let count = 1;
                for(let j=i+1;j<bike.length;j++){
                    if(bike[i]===bike[j]){
                        count++;
                        visited[j]=true;
                    }
               }
               console.log(bike[i]+" occurs "+count+ " times");
            }
            
        console.log("-- 8.Check whether an array is sorted");

            let num = Number(prompt("Enter the size of array"));
            let sor = [];

            for(let i=0;i<num;i++){
                sor[i]=Number(prompt("Enter the values of array "+(i+1)));
            }

            let sorted = true;

            for(let i=0;i<num-1;i++){
                    if(sor[i]>sor[i+1]){
                        sorted = false;
                        break;
                    }
                } 
            if(sorted){
                console.log("Array is Sorted");
            }else{
                console.log("Array is Not Sorted");
            }


        console.log("-- 9.Find the missing number in an array (1 to n)");

            let n=Number(prompt("Enter size of array"));
            let mis=[];

            for(let i=0;i<n-1;i++){
                mis[i]=Number(prompt("Enter the value"))
            }

            let sum=0;
            let expected=0;

            for(let i=0;i<=n;i++){
                expected+=i;
            }

            for(let i=0;i<mis.length;i++){
                sum+=mis[i];
            }
            let missing= expected-sum;
            console.log("The missing number is " +missing);

            
        console.log("10.Separate even and odd numbers into two arrays");

            let array=[1,2,3,4,5,6];
            let even=[];
            let odd=[];

            for(let i=0;i<array.length;i++){
                if(array[i]%2==0){
                    even.push(array[i]);
                }else{
                    odd.push(array[i]);
                }
            }
            console.log("Even array :",even);
            console.log("odd array :",odd);
